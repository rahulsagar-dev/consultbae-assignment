<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ConsultBae — Audio Submission (mini)</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 1.4rem; }
  label { display: block; margin-top: 14px; font-weight: 600; font-size: 0.9rem; }
  input[type=text], input[type=tel] { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
  button { margin-top: 10px; padding: 8px 14px; cursor: pointer; }
  #recordBtn.recording { background: #d33; color: white; }
  #status { margin-top: 10px; font-size: 0.9rem; color: #555; }
  #result { margin-top: 16px; padding: 12px; background: #f4f4f4; border-radius: 6px; display: none; }
  #result table { width: 100%; }
  #result td:first-child { color: #666; }
  a.nav { display: inline-block; margin-top: 20px; font-size: 0.9rem; }
</style>
</head>
<body>
  <h1>Submit a voice sample</h1>
  <p>Record in the browser, or upload an audio file if you'd rather not use the mic.</p>

  <label for="name">Full name</label>
  <input type="text" id="name" required>

  <label for="phone">Phone number</label>
  <input type="tel" id="phone" required>

  <label>Audio</label>
  <div>
    <button id="recordBtn" type="button">● Start recording</button>
    <span id="recTimer"></span>
  </div>
  <div style="margin-top:8px;">
    <input type="file" id="fileInput" accept="audio/*">
  </div>
  <audio id="preview" controls style="display:none; margin-top:10px; width:100%;"></audio>

  <div>
    <button id="submitBtn" type="button" disabled>Submit</button>
  </div>
  <div id="status"></div>

  <div id="result">
    <strong>Extracted properties:</strong>
    <table>
      <tr><td>Duration</td><td id="r_duration"></td></tr>
      <tr><td>Sample rate</td><td id="r_rate"></td></tr>
      <tr><td>Bitrate</td><td id="r_bitrate"></td></tr>
      <tr><td>Loudness</td><td id="r_loudness"></td></tr>
      <tr><td>Noise estimate</td><td id="r_noise"></td></tr>
    </table>
  </div>

  <a class="nav" href="/submissions">View all submissions →</a>

<script>
let mediaRecorder, chunks = [], recordedBlob = null, startTime;
const recordBtn = document.getElementById('recordBtn');
const fileInput = document.getElementById('fileInput');
const preview = document.getElementById('preview');
const submitBtn = document.getElementById('submitBtn');
const statusEl = document.getElementById('status');
const recTimer = document.getElementById('recTimer');
let timerInterval;

recordBtn.addEventListener('click', async () => {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    chunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => chunks.push(e.data);
    mediaRecorder.onstop = () => {
      recordedBlob = new Blob(chunks, { type: 'audio/webm' });
      preview.src = URL.createObjectURL(recordedBlob);
      preview.style.display = 'block';
      submitBtn.disabled = false;
      recordBtn.textContent = '● Start recording';
      recordBtn.classList.remove('recording');
      clearInterval(timerInterval);
      recTimer.textContent = '';
      stream.getTracks().forEach(t => t.stop());
    };
    mediaRecorder.start();
    recordBtn.textContent = '■ Stop recording';
    recordBtn.classList.add('recording');
    startTime = Date.now();
    timerInterval = setInterval(() => {
      recTimer.textContent = ((Date.now() - startTime) / 1000).toFixed(1) + 's';
    }, 100);
  } catch (err) {
    statusEl.textContent = 'Mic access denied or unavailable: ' + err.message + '. Use file upload instead.';
  }
});

fileInput.addEventListener('change', () => {
  if (fileInput.files.length) {
    recordedBlob = fileInput.files[0];
    preview.src = URL.createObjectURL(recordedBlob);
    preview.style.display = 'block';
    submitBtn.disabled = false;
  }
});

submitBtn.addEventListener('click', async () => {
  const name = document.getElementById('name').value.trim();
  const phone = document.getElementById('phone').value.trim();
  if (!name || !phone) { statusEl.textContent = 'Name and phone are required.'; return; }
  if (!recordedBlob) { statusEl.textContent = 'Record or upload audio first.'; return; }

  const fd = new FormData();
  fd.append('name', name);
  fd.append('phone', phone);
  const filename = recordedBlob.name || 'recording.webm';
  fd.append('audio', recordedBlob, filename);

  submitBtn.disabled = true;
  statusEl.textContent = 'Uploading & analyzing...';

  try {
    const res = await fetch('/api/submit', { method: 'POST', body: fd });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Upload failed');
    statusEl.textContent = 'Submitted ✓';
    document.getElementById('result').style.display = 'block';
    document.getElementById('r_duration').textContent = data.duration_sec + ' sec';
    document.getElementById('r_rate').textContent = (data.sample_rate_hz / 1000).toFixed(1) + ' kHz';
    document.getElementById('r_bitrate').textContent = (data.bitrate_kbps ?? 'n/a') + ' kbps';
    document.getElementById('r_loudness').textContent = (data.loudness_db ?? 'n/a') + ' dB';
    document.getElementById('r_noise').textContent = data.noise_estimate;
  } catch (err) {
    statusEl.textContent = 'Error: ' + err.message;
  } finally {
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
